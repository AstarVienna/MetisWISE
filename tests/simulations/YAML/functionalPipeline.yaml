# LM-only functional set, preserving the previously enabled simulations.
# Calibrations are explicit; automatic --doCalib generation is disabled.

DETLIN_2RG_ON_1:
  do.catg: DETLIN_2RG_RAW
  mode: wcu_img_lm
  source:
    name: empty_sky
    kwargs: {}
  properties:
    dit: 1.0
    ndit: 1
    filter_name: IB_4.05
    nd_filter_name: ND_OD3
    catg: CALIB
    tech: IMAGE,LM
    type: DETLIN
