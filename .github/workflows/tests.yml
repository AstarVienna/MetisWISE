name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_EXTRA_INDEX_URL: >-
        https://pip.entropynaut.com/packages/
        https://ftp.eso.org/pub/dfs/pipelines/libraries
        https://ivh.github.io/pycpl/simple/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql postgresql-contrib

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group postgres
          # eso-pymetis 0.1.0 pins an older pycpl in its metadata. Apply the
          # required version afterwards to avoid pip's conflicting pins.
          python -m pip install --upgrade "pycpl==1.0.4.post10"

      - name: Run tests without PostgreSQL
        run: python -m pytest --junitxml=reports/default.xml

      # The hosted runner is a regular user. pytest starts its own temporary
      # PostgreSQL cluster; no database service or database secrets are needed.
      - name: Run tests with PostgreSQL
        run: python -m pytest --run-postgresql --junitxml=reports/postgresql.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/*.xml
          if-no-files-found: ignore
