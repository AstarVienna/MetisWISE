name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql postgresql-contrib

      - name: Install Python dependencies
        run: uv sync --python 3.12 --group postgres

      - name: Run tests without PostgreSQL
        run: uv run --no-sync python -m pytest --junitxml=reports/default.xml

      # The hosted runner is a regular user. pytest starts its own temporary
      # PostgreSQL cluster; no database service or database secrets are needed.
      - name: Run tests with PostgreSQL and coverage
        run: |
          uv run --no-sync python -m coverage run --branch --source=metiswise -m pytest --run-postgresql --junitxml=reports/postgresql.xml
          uv run --no-sync python -m coverage report --show-missing
          uv run --no-sync python -m coverage xml -o reports/coverage.xml
          uv run --no-sync python -m coverage html -d reports/htmlcov

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AstarVienna/MetisWISE

      - name: Coveralls
        uses: coverallsapp/github-action@v2
