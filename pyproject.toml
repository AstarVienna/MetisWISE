[project]
name = "MetisWISE"
version = "0.0.5"
description = "MetisWISE"
readme = "README.md"
requires-python = ">=3.12, <3.14" #Matches pymetis
authors = [
    {name = "Hugo Buddelmeijer", email="hugo@buddelmeijer.nl"},
]
maintainers = [
    {name = "Hugo Buddelmeijer", email="hugo@buddelmeijer.nl"},
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "psycopg2-binary",
    "commonwise>=2026.11.0.post1",
    "metis-drld",
    "pymetis>=0.4.1",
    "pycpl>=1.0.4.post10",
]

[dependency-groups]
test = [
    "pytest",
    "coverage",
    "dataserverwise",
    "edps",
    "pyesorex",
    "adari-core",
]
dev = [{include-group = "test"}, "build"]
notebook = ["jupyter"]
simulations = ["metis-simulations>=20260824.post27"]
postgres = [
    {include-group = "test"},
    "pytest-postgresql>=7",
    "psycopg[binary]>=3",
]

[tool.uv.sources]
commonwise = { index = "entropynaut" }
dataserverwise = { index = "entropynaut" }
metis-drld = { index = "entropynaut" }
metis-simulations = { index = "entropynaut" }
pymetis = { index = "entropynaut" }
pycpl = { index = "pycpl" }
edps = { index = "eso" }
pyesorex = { index = "eso" }
adari-core = { index = "eso" }

[[tool.uv.index]]
name = "entropynaut"
url = "https://pip.entropynaut.com/packages/"
explicit = true

[[tool.uv.index]]
name = "pycpl"
url = "https://ivh.github.io/pycpl/simple/"
explicit = true

[[tool.uv.index]]
name = "eso"
url = "https://ftp.eso.org/pub/dfs/pipelines/libraries"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ingestion_dataset: ingest a compact FITS fixture without running simulations or EDPS",
    "postgresql: integration tests requiring a temporary local PostgreSQL server",
    "simulations: real ScopeSim simulations requiring instrument data and potentially network access",
]

[project.urls]
"Source" = "https://github.com/AstarVienna/MetisWISE"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["metiswise*"]

[tool.setuptools.package-data]
metiswise = ["config/Environment.cfg"]
