[project]
name = "MetisWISE"
version = "0.0.5"
description = "MetisWISE"
readme = "README.md"
requires-python = ">=3.11, <3.14" #Matches pymetis
authors = [
    {name = "Hugo Buddelmeijer", email="hugo@buddelmeijer.nl"},
]
maintainers = [
    {name = "Hugo Buddelmeijer", email="hugo@buddelmeijer.nl"},
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy",
    "psycopg2-binary",
    # From https://pip.entropynaut.com/packages
    "dataserverwise",
    "commonwise",
    "metis-drld",
    # TODO:Temporary guard so that the package from entropynaut is used instead of the one on PyPi
    "pymetis<0.9.0",
]

[project.optional-dependencies]
notebook = ["jupyter"]

[dependency-groups]
test = ["pytest", "coverage"]
dev = [{include-group = "test"}, "build"]

[project.urls]
"Source" = "https://github.com/AstarVienna/MetisWISE"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["metiswise*"]

[tool.setuptools.package-data]
metiswise = ["config/Environment.cfg"]
